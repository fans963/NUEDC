[package]
name = "nuedc"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34-deprecated"
log = "0.4.33"
env_logger = "0.11.11"
foxglove = { version = "0.25.3", features = ["websocket", "derive"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
nalgebra = "0.35.0"
nokhwa = { version = "0.10.11", features = ["input-v4l"] }
image = "0.25.10"
nusb = { version = "0.2.4", features = ["smol"] }
pollster = "0.4.0"
ctrlc = "3.5.2"
bytes = "1.12.0"
flatbuffers = "25.12.19"
inventory = "0.3.24"
imageproc = "0.27.0"
rayon = "1.12.0"
